<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뱀한테서 도망쳐! — 생쥐 추첨 게임</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1612;
      color: #eee;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }

    /* ── 설정 패널 (플로팅) ── */
    .panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      background: rgba(18, 36, 26, 0.96);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 1.6rem 1.5rem;
      z-index: 10;
      transition: opacity 0.25s, transform 0.25s;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    }

    .panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, calc(-50% - 10px));
    }

    .panel h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #7dd49a;
      margin-bottom: 0.7rem;
      text-align: center;
    }

    .panel .subtitle {
      color: #aaa;
      font-size: 0.98rem;
      margin-bottom: 1.8rem;
      line-height: 1.5;
      text-align: center;
    }

    .hint {
      margin-top: 1rem;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }

    .mice-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.75rem 0 0.1rem;
    }

    .mice-head h3 { margin: 0; }

    .btn-mini {
      background: transparent;
      color: #7dd49a;
      border: none;
      width: 24px;
      height: 24px;
      margin: -4px 0;        /* 행 높이를 키우지 않도록 (아래 간격 유지) */
      position: relative;
      top: 3px;              /* 텍스트와 세로 중앙 맞춤 */
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      transition: background 0.12s, transform 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-mini:hover { background: rgba(125,212,154,0.12); }
    .btn-mini:active { transform: rotate(180deg); }

    .panel h3 {
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #d8eee0;
      margin: 1.8rem 0 1rem;
    }

    textarea {
      width: 100%;
      background: #133723;
      border: 1px solid #2e5c40;
      border-radius: 8px;
      color: #eee;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
      font-family: inherit;
      line-height: 1.55;
      outline: none;
      resize: vertical;
      min-height: 100px;
    }

    textarea:focus { border-color: #7dd49a; }

    .row { display: flex; gap: 0.5rem; margin-top: 1rem; }

    .btn {
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      background: #7dd49a;
      color: #0e1b13;
      transition: all 0.12s;
    }

    .btn:hover:not(:disabled) { background: #93e2ad; transform: translateY(-1px); }
    .btn:disabled { background: #555; color: #888; cursor: default; transform: none; }

    .btn-ghost {
      background: transparent;
      color: #7dd49a;
      border: 1.5px solid #7dd49a;
    }

    .btn-ghost:hover { background: rgba(125,212,154,0.1); }

    .btn-block { width: 100%; margin-top: 1.3rem; padding: 0.9rem; font-size: 1.15rem; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 170px;
      overflow-y: auto;
    }

    .chip {
      border-radius: 99px;
      padding: 0.25rem 0.75rem;
      font-size: 0.92rem;
      font-weight: 600;
      color: #0e1b13;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .chip button {
      background: none;
      border: none;
      color: rgba(0,0,0,0.45);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
    }

    .count { color: #7dd49a; font-weight: 700; }

    /* ── 설정 열기 버튼 (게임 중) ── */
    .gear {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 9;
      display: none;
      background: rgba(18, 36, 26, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #eee;
      border-radius: 10px;
      padding: 0.5rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .gear.show { display: block; }
    .gear:hover { background: rgba(28, 54, 39, 0.95); }

    /* ── HUD ── */
    .hud {
      position: fixed;
      top: 18px;
      right: 18px;
      background: rgba(13,22,17,0.75);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 99px;
      padding: 0.4rem 1.1rem;
      font-size: 0.92rem;
      font-weight: 700;
      color: #7dd49a;
      pointer-events: none;
      display: none;
      z-index: 9;
    }

    .hud.show { display: block; }

    /* ── 결과 배너 ── */
    .banner {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: rgba(13, 22, 17, 0.8);
      text-align: center;
      z-index: 20;
    }

    .banner.show { display: flex; }

    .banner .big {
      font-size: 2.6rem;
      font-weight: 800;
      color: #7dd49a;
    }

    .banner .sub { color: #ccc; font-size: 1.05rem; }
    .banner .tomb { font-size: 4.2rem; line-height: 1; }
    .banner .row { gap: 0.7rem; }
  </style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="panel" id="panel">
  <h1>🐍 뱀한테서 도망쳐!</h1>
  <div class="subtitle">배고픈 뱀에게서 도망치는 생쥐들..<br>과연 살아남을 수 있을까요?</div>

  <h3>명단 붙여넣기</h3>
  <textarea id="bulkNames" placeholder="명단을 입력해주세요."></textarea>
  <div class="row">
    <button class="btn" style="flex:1" onclick="applyBulk()">명단 적용</button>
    <button class="btn btn-ghost" onclick="clearNames()">초기화</button>
  </div>

  <div class="mice-head">
    <h3 id="miceLabel">생쥐 0마리</h3>
    <button class="btn-mini" onclick="shuffleNames()" title="순서 섞기">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </button>
  </div>
  <div class="chips" id="chips"></div>

  <button class="btn btn-block" id="startBtn" onclick="startRun()">도망 시작!</button>
  <div class="hint">[도망 시작!] 버튼을 누르면 추격전이 시작됩니다</div>
</div>

<button class="gear" id="gear" onclick="openSettings()">⚙ 설정</button>
<div class="hud" id="hud"></div>

<div class="banner" id="banner">
  <div class="tomb">🪦</div>
  <div class="big" id="bannerText"></div>
  <div class="sub">다음주 발표로 뵙겠습니다:)</div>
  <div class="row">
    <button class="btn" onclick="replay()">다시 추첨</button>
    <button class="btn btn-ghost" onclick="openSettings()">명단 수정</button>
  </div>
</div>

<script>
  // ── Viewport / Camera (전체화면, 리사이즈 대응) ────────────────
  let W, H, SCALE, VIS_W, VIS_H, DPR = 1;
  const VIEW_WORLD_H = 320;           // 화면 세로에 보이는 월드 높이 (확대 기준)

  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    SCALE = H / VIEW_WORLD_H;
    VIS_W = W / SCALE;
    VIS_H = H / SCALE;
    DPR = window.devicePixelRatio || 1;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  resize();
  window.addEventListener('resize', resize);

  // 명단 순서만 랜덤으로 섞기 (추가/삭제 없음, 위 입력창은 그대로)
  function shuffleNames() {
    if (names.length < 2) return;
    shuffle(names);
    renderChips(false);
    resetStage();
  }

  function clearNames() {
    names = [];
    renderChips();
    document.getElementById('bulkNames').value = '';
    document.getElementById('bulkNames').focus();
    resetStage();
  }

  // ── World geometry ─────────────────────────────────────────────
  const SPEED = 240;                  // 달리기 속도 px/s
  const FORK_SPACING = 880;           // 갈림길 간격 (한 화면에 하나만 보임)
  const FIRST_FORK   = 1100;
  const BASE_Y    = 360;              // 길 기준 높이 (월드 y)
  const PATH_STEP = 350;              // 길 굴곡 웨이포인트 간격

  // 길: 랜덤 워크 웨이포인트를 코사인 보간한 굽이치는 경로
  let pathPts = [];

  function pathY(x) {
    if (!pathPts.length) return BASE_Y;
    if (x <= 0) return pathPts[0];
    const k = Math.floor(x / PATH_STEP);
    if (k >= pathPts.length - 1) return pathPts[pathPts.length - 1];
    const t = (x - k * PATH_STEP) / PATH_STEP;
    const c = (1 - Math.cos(Math.PI * t)) / 2;
    return pathPts[k] * (1 - c) + pathPts[k + 1] * c;
  }

  // ── Mice setup ─────────────────────────────────────────────────
  const MAX_MICE = 80;

  function paletteAt(i) {
    const h = Math.round(i * 137.508) % 360;   // 골든앵글로 색 분산
    return {
      color: `hsl(${h}, 62%, 72%)`,
      dark:  `hsl(${h}, 45%, 45%)`,
    };
  }

  let names = ['명훈','명근','고승희','현진','미지','민봉','민수','민영','상혁','정연','진주','김철','태윤','하연','지헌','성호','세호','예빈','정후','지우','판수','현수','재민','석린','현철','진현','지현','나래','선미','지희','대훈','상현','연수','재혁','필웅','호재','환희','정빈','태윤','은진','주영','한소루','민서','석현','정애','규완','최승희','혜림','한수','강은','성옥','봉준','Thi Hong Anh Dinh','Bao Le Vy Nguyen','Huynh Ngoc Tram Anh','Thi Thu Ha Nguyen','Hoang Thai Duy Nguyen','Khuong Vu Nguyen'];

  function applyBulk() {
    const raw = document.getElementById('bulkNames').value;
    // 쉼표/줄바꿈으로만 구분 (이름 안의 띄어쓰기는 유지 — 예: Hoang Thai Duy Nguyen)
    const parsed = [...new Set(raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean))];
    if (parsed.length < 2) { alert('이름을 2개 이상 입력해주세요!'); return; }
    if (parsed.length > MAX_MICE) {
      alert(`최대 ${MAX_MICE}명까지 가능해요! (현재 ${parsed.length}명)`);
      return;
    }
    names = parsed;
    renderChips();
    resetStage();
  }

  function removeMouse(i) {
    names.splice(i, 1);
    renderChips();
    resetStage();
  }

  function renderChips(syncTextarea = true) {
    document.getElementById('chips').innerHTML = names.map((n, i) =>
      `<span class="chip" style="background:${paletteAt(i).color}">${n}<button onclick="removeMouse(${i})">×</button></span>`
    ).join('');
    document.getElementById('miceLabel').textContent = `생쥐 ${names.length}마리`;
    if (syncTextarea) document.getElementById('bulkNames').value = names.join(', ');
  }

  renderChips();

  // ── Run state ──────────────────────────────────────────────────
  let mice = [];
  let forks = [];
  let phase = 'idle';    // idle | run | catch | done
  let worldX = 0;
  let camX = 0;
  let camY = BASE_Y - VIS_H / 2;
  let catchX = 3800;
  let worldW = 4100;
  let snakeX = -150;
  let mouthA = 0.62;
  let chompT = -1;
  let chompPos = null;
  let tripX = 0;          // 당첨 생쥐가 넘어지는 지점
  let snapT = -1;         // 무는 순간 타이머
  let victimIdx = -1;
  let lastTime = 0;

  function planRun() {
    const n = names.length;
    mice = names.map((name, i) => ({
      name, ...paletteAt(i),
      status: 'chased',
      x: 0, y: BASE_Y,
      hole: null, slot: 0,
    }));

    victimIdx = Math.floor(Math.random() * n);   // 당첨(잡힐) 생쥐 — 균등 확률

    // 무리 크기: 10마리가 될 때까지 절반씩 → 10 → 5 → 3 → (1마리 잡힘)
    // 예: 57명 → 29 → 15 → 10 → 5 → 3 → 1
    // 인원이 적으면 해당 단계는 자동으로 건너뜀 (예: 8명 → 4 → 3 → 1)
    const escapePlans = [];
    let group = mice.map((_, i) => i);
    const targets = [];
    let s = Math.round(n / 2);
    while (s > 10) { targets.push(s); s = Math.round(s / 2); }
    targets.push(10, 5, 3);
    for (const t of targets) {
      if (t >= group.length || t < 3) continue;
      const others = group.filter(i => i !== victimIdx);
      shuffle(others);
      const escapees = others.slice(0, group.length - t);
      escapePlans.push(escapees);
      group = group.filter(i => !escapees.includes(i));
    }

    // 마지막 갈림길에서 조금만 더 달리다가 잡힘
    const F = escapePlans.length;
    catchX = F > 0 ? FIRST_FORK + (F - 1) * FORK_SPACING + 340 : 1200;
    worldW = catchX + 400;

    // 굽이치는 길 생성
    pathPts = [];
    const steps = Math.ceil((worldW + 800) / PATH_STEP) + 2;
    let py = BASE_Y;
    for (let k = 0; k < steps; k++) {
      if (k < 2) { pathPts.push(BASE_Y); continue; }   // 출발 구간은 평탄하게
      const dir = Math.random() < 0.5 ? -1 : 1;
      let ny = py + dir * (70 + Math.random() * 90);
      ny = Math.max(190, Math.min(530, ny));
      pathPts.push(ny);
      py = ny;
    }

    forks = escapePlans.map((escapees, j) => {
      const fx = FIRST_FORK + j * FORK_SPACING;
      const hx = fx + 430;
      const dir = j % 2 === 0 ? -1 : 1;     // 위/아래 번갈아
      // 샛길 곡선: 메인 길에서 접선 방향으로 갈라져 구멍까지
      const p0 = { x: fx, y: pathY(fx) };
      const p1 = { x: hx, y: pathY(hx) + dir * 165 };
      const cp = { x: p0.x + (p1.x - p0.x) * 0.6, y: p0.y + (p1.y - p0.y) * 0.12 };
      const dx = p1.x - p0.x, dy = p1.y - p0.y;
      const len = Math.hypot(dx, dy);
      return {
        x: fx,
        holeX: hx,
        holeY: p1.y,
        dir,
        p0, cp, p1,
        curveLen: len * 1.08,
        nx: -dy / len, ny: dx / len,   // 샛길의 수직 방향 (대형 분산용)
        escapees,
        triggered: false,
      };
    });
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  }

  // ── Controls ───────────────────────────────────────────────────
  function startRun() {
    if (names.length < 2) { alert('생쥐를 2마리 이상 넣어주세요!'); return; }
    if (phase === 'run' || phase === 'catch') return;

    planRun();
    worldX = 110;
    camX = 0;
    camY = pathY(110) - VIS_H / 2;
    snakeX = -150;
    mouthA = 0.62;
    chompT = -1;
    chompPos = null;
    snapT = -1;
    phase = 'run';

    mice.forEach((m, i) => {
      const t = formationTarget(i);
      m.x = t.x; m.y = t.y;
    });

    document.getElementById('panel').classList.add('hidden');
    document.getElementById('gear').classList.add('show');
    document.getElementById('banner').classList.remove('show');
    updateHud();
  }

  function replay() {
    document.getElementById('banner').classList.remove('show');
    phase = 'idle';
    startRun();
  }

  function openSettings() {
    resetStage();
    document.getElementById('panel').classList.remove('hidden');
    document.getElementById('gear').classList.remove('show');
  }

  function resetStage() {
    phase = 'idle';
    mice = [];
    forks = [];
    chompT = -1;
    chompPos = null;
    camX = 0;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('banner').classList.remove('show');
    document.getElementById('hud').classList.remove('show');
  }

  function updateHud() {
    const hud = document.getElementById('hud');
    const cnt = chasedList().length;
    if (phase === 'run' || phase === 'catch') {
      hud.textContent = `🐭 남은 생쥐 ${cnt}마리`;
      hud.classList.add('show');
    }
  }

  // ── Formation (밀집 대형: 여러 줄) ─────────────────────────────
  function chasedList() {
    return mice.map((_, i) => i).filter(i => mice[i].status === 'chased');
  }

  function rowsFor(count) {
    return count >= 30 ? 6 : count >= 20 ? 5 : count >= 13 ? 4 : count >= 7 ? 3 : count >= 3 ? 2 : 1;
  }

  function formationTarget(idx) {
    const list = chasedList();
    const rank = list.indexOf(idx);
    const rows = rowsFor(list.length);
    const col = Math.floor(rank / rows);
    const row = rank % rows;
    const x = worldX - col * 30;
    return {
      x,
      y: pathY(x) + (row - (rows - 1) / 2) * 26,
    };
  }

  function packTailX() {
    const list = chasedList();
    const rows = rowsFor(list.length);
    const cols = Math.ceil(list.length / rows);
    return worldX - (cols - 1) * 30;
  }

  function qbez(p0, cp, p1, t) {
    const u = 1 - t;
    return {
      x: u * u * p0.x + 2 * u * t * cp.x + t * t * p1.x,
      y: u * u * p0.y + 2 * u * t * cp.y + t * t * p1.y,
    };
  }

  function moveToward(m, tx, ty, maxDist) {
    const dx = tx - m.x, dy = ty - m.y;
    const d = Math.hypot(dx, dy);
    if (d <= maxDist) { m.x = tx; m.y = ty; return true; }
    m.x += dx / d * maxDist;
    m.y += dy / d * maxDist;
    return false;
  }

  // ── Main loop ──────────────────────────────────────────────────
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000 || 0);
    lastTime = now;
    const time = now / 1000;

    if (phase === 'run') {
      worldX += SPEED * dt;

      for (const f of forks) {
        if (!f.triggered && worldX >= f.x) {
          f.triggered = true;
          for (const idx of f.escapees) {
            mice[idx].status = 'escaping';
            mice[idx].hole = f;
            mice[idx].slot = f.escapees.indexOf(idx);
          }
          updateHud();
        }
      }

      if (worldX >= catchX) {
        phase = 'catch';
        tripX = worldX + 100;
        // 당첨 생쥐만 뒤처지고 나머지는 전력 질주로 탈출
        for (const i of chasedList()) {
          if (i !== victimIdx) {
            mice[i].status = 'fleeing';
            mice[i].fleeOff = mice[i].y - pathY(mice[i].x);
          }
        }
      }
    }

    if (phase === 'catch') {
      const v = mice[victimIdx];
      if (v.status === 'chased') {
        worldX += SPEED * 0.75 * dt;          // 마지막 발악 질주
        if (worldX >= tripX) { v.status = 'tripped'; v.tripT = 0; }
      }
    }

    // 생쥐 이동
    mice.forEach((m, i) => {
      if (m.status === 'chased') {
        const t = formationTarget(i);
        m.x = t.x;
        m.y += (t.y - m.y) * Math.min(1, dt * 7);
      } else if (m.status === 'escaping') {
        const f = m.hole;
        m.escT = (m.escT || 0) + (SPEED * 1.15 * dt) / f.curveLen;
        if (m.escT < 1) {
          // 샛길 곡선을 따라 이동 (살짝 옆으로 퍼져서)
          const p = qbez(f.p0, f.cp, f.p1, m.escT);
          const off = (m.slot % 3 - 1) * 13;
          moveToward(m, p.x + f.nx * off, p.y + f.ny * off, SPEED * 1.35 * dt);
        } else {
          // 쥐구멍 속으로 쏙 들어가서 사라짐
          const cy = f.dir === -1 ? f.holeY + 26 : f.holeY;
          if (moveToward(m, f.holeX, cy, SPEED * 1.35 * dt)) m.status = 'safe';
        }
      } else if (m.status === 'fleeing') {
        // 마지막 3마리 중 살아남은 생쥐들: 길을 따라 계속 도망
        m.x += SPEED * 1.18 * dt;
        m.y += (pathY(m.x) + (m.fleeOff || 0) - m.y) * Math.min(1, dt * 7);
      } else if (m.status === 'tripped') {
        m.tripT += dt;
      }
    });

    // 뱀 추격 (무리가 줄수록 더 바짝 따라붙음)
    if (phase === 'run' || phase === 'catch') {
      const gap = Math.max(38, 28 + chasedList().length * 2.6);
      const v = mice[victimIdx];
      const lunging = phase === 'catch' && v.status === 'tripped' && v.tripT >= 0.55;
      let targetX, chaseSpd;
      if (phase === 'run') {
        targetX = packTailX() - gap;
        chaseSpd = SPEED * 1.3;
      } else if (!lunging) {
        // 넘어지기 전 + 넘어진 직후: 거리를 유지하며 바짝 추격
        targetX = v.x - 54;
        chaseSpd = SPEED * 1.3;
      } else {
        // 넘어져 버둥거리는 걸 보고 그제서야 돌진!
        targetX = v.x - 2;
        chaseSpd = SPEED * 2.4;
      }
      snakeX += Math.min(chaseSpd * dt, Math.max(0, targetX - snakeX));

      if (phase === 'catch') {
        // 돌진하며 입을 점점 크게 벌림
        const targetMouth = lunging ? 1.25 : 0.7;
        mouthA += (targetMouth - mouthA) * Math.min(1, dt * 11);
        if (lunging && snakeX + 26 >= v.x - 4) {
          phase = 'snap';
          snapT = 0;
        }
      }
    }

    // 확! 무는 순간 (입이 빠르게 닫힘)
    if (phase === 'snap') {
      snapT += dt;
      const p = Math.min(1, snapT / 0.1);
      mouthA = 1.25 + (0.05 - 1.25) * p;
      snakeX += SPEED * 1.4 * dt * (1 - p);   // 다물면서 살짝 덮쳐 들어감
      const v = mice[victimIdx];
      if (p >= 1 && v.status !== 'caught') {
        v.status = 'caught';
        chompPos = { x: v.x, y: v.y };
        chompT = 0;
        phase = 'done';
        setTimeout(() => {
          document.getElementById('bannerText').textContent = `${v.name}님이 뱀에게 잡혔습니다!`;
          document.getElementById('banner').classList.add('show');
          document.getElementById('startBtn').disabled = false;
        }, 1300);
      }
    }

    // 카메라: 굽이치는 길을 따라 무리를 추적
    if (phase !== 'idle') {
      const targetCam = Math.max(0, Math.min(worldX - VIS_W * 0.64, worldW - VIS_W));
      camX += (targetCam - camX) * Math.min(1, dt * 6);
      const targetCamY = pathY(worldX) - VIS_H / 2;
      camY += (targetCamY - camY) * Math.min(1, dt * 5.5);
    }

    if (chompT >= 0) chompT += dt;

    draw(time);
    requestAnimationFrame(loop);
  }

  // ── Drawing ────────────────────────────────────────────────────
  function draw(time) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d1612';
    ctx.fillRect(0, 0, W, H);

    if (phase === 'idle') return;

    ctx.save();
    ctx.scale(SCALE, SCALE);
    ctx.translate(-camX, -camY);

    // 굽이치는 길
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 95;
    ctx.lineCap = 'round';
    ctx.beginPath();
    let firstPt = true;
    for (let x = camX - 60; x < camX + VIS_W + 60; x += 24) {
      const y = pathY(x);
      if (firstPt) { ctx.moveTo(x, y); firstPt = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // 길가 풀숲 점 (스크롤 체감용)
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    const tuftStart = Math.floor((camX - 50) / 90) * 90;
    for (let tx = tuftStart; tx < camX + VIS_W + 90; tx += 90) {
      const ty = pathY(tx) + 70 + (tx * 7919 % 60);
      ctx.beginPath(); ctx.arc(tx, ty, 3, 0, Math.PI * 2); ctx.fill();
      const ty2 = pathY(tx + 40) - 80 - (tx * 6271 % 50);
      ctx.beginPath(); ctx.arc(tx + 40, ty2, 3, 0, Math.PI * 2); ctx.fill();
    }

    // 갈림길: 메인 길과 같은 모양의 샛길 (좀 더 얇게)
    for (const f of forks) {
      if (f.holeX < camX - 250 || f.x > camX + VIS_W + 250) continue;
      ctx.strokeStyle = 'rgba(255,255,255,0.045)';
      ctx.lineWidth = 52;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(f.p0.x, f.p0.y);
      ctx.quadraticCurveTo(f.cp.x, f.cp.y, f.p1.x, f.p1.y);
      ctx.stroke();
      drawHole(f.holeX, f.holeY, f.dir === -1);
    }

    drawSnake(time);

    mice.forEach((m, i) => {
      if (m.status === 'caught' || m.status === 'safe') return;   // 구멍에 들어간 생쥐는 안 보임
      if (m.x < camX - 80 || m.x > camX + VIS_W + 80) return;
      const bob = (m.status === 'safe' || m.status === 'tripped') ? 0 : Math.sin(time * 14 + i * 1.7) * 2.5;
      drawMouse(m.x, m.y + bob, m, time, i);
    });

    if (chompT >= 0 && chompT < 0.55 && chompPos) drawBurst(chompPos.x, chompPos.y, chompT);

    ctx.restore();
  }

  // 쥐구멍
  function drawHole(x, y, isTop) {
    // 위쪽 구멍은 화면 밖으로 나가지 않도록 아치를 앵커 아래쪽에 그림 (모양은 동일)
    const cy = isTop ? y + 26 : y;
    ctx.save();
    ctx.translate(x, cy);
    ctx.beginPath();
    ctx.arc(0, 0, 26, Math.PI, 0);
    ctx.closePath();
    ctx.fillStyle = '#080a14';
    ctx.fill();
    ctx.strokeStyle = 'rgba(125,212,154,0.5)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();
  }

  // ── 생쥐 (옆모습, 오른쪽으로 달림) ─────────────────────────────
  function drawMouse(x, y, m, time, seed) {
    ctx.save();
    ctx.translate(x, y);

    // 넘어지는 모션: 앞으로 미끄러지며 고꾸라짐
    const tripP = m.status === 'tripped' ? Math.min(1, (m.tripT || 0) / 0.3) : 0;
    if (tripP > 0) {
      ctx.translate(tripP * 18, tripP * 6);
      ctx.rotate(1.35 * tripP);
    }

    const wag = Math.sin(time * 10 + seed) * 3;
    ctx.strokeStyle = m.dark;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, 1);
    ctx.quadraticCurveTo(-22, wag, -28, -4 + wag);
    ctx.stroke();

    if (m.status !== 'safe') {
      // 넘어졌을 땐 다리를 버둥버둥
      const leg = m.status === 'tripped'
        ? Math.sin(time * 42 + seed) * 6
        : Math.sin(time * 22 + seed * 2) * 4;
      ctx.strokeStyle = m.dark;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-5, 8); ctx.lineTo(-5 + leg, 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5, 8); ctx.lineTo(5 - leg, 12); ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(2, -10, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = m.color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(2, -10, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#f5c3cd';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(14, -1);
    ctx.quadraticCurveTo(8, -10, -2, -9);
    ctx.quadraticCurveTo(-13, -7, -12, 1);
    ctx.quadraticCurveTo(-11, 9, 0, 9);
    ctx.quadraticCurveTo(9, 9, 14, -1);
    ctx.fillStyle = m.color;
    ctx.fill();

    ctx.fillStyle = '#26262e';
    ctx.beginPath(); ctx.arc(7, -3.5, 1.8, 0, Math.PI * 2); ctx.fill();

    ctx.beginPath();
    ctx.arc(14, -1, 2, 0, Math.PI * 2);
    ctx.fillStyle = '#e2606b';
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(11, -1); ctx.lineTo(17, -4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11, 0);  ctx.lineTo(17, 1);  ctx.stroke();

    ctx.restore();

    // 넘어질 때 흙먼지 + 꽈당!
    if (m.status === 'tripped' && m.tripT < 0.8) {
      const q = m.tripT / 0.8;
      ctx.globalAlpha = 1 - q;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.arc(x - 12 - k * 9 - q * 12, y + 6 - k * 4 - q * 10, 4.5 - k, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.font = 'bold 15px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = '#7dd49a';
      ctx.fillText('꽈당!', x + 8, y - 26);
    }

    ctx.font = 'bold 10px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = m.color;
    ctx.fillText(m.name, x, y - 15);
  }

  // ── 뱀 (입 벌리고 추격) ────────────────────────────────────────
  function drawSnake(time) {
    const hx = snakeX, hy = pathY(snakeX);
    const R = 26;

    ctx.strokeStyle = '#4c8a5f';
    ctx.lineWidth = 18;
    ctx.lineCap = 'round';
    ctx.beginPath();
    let first = true;
    for (let x = hx - R + 6; x > camX - 60; x -= 12) {
      const dist = (hx - x) / 60;
      const amp = Math.min(14, dist * 9);
      const y = pathY(x) + Math.sin(x * 0.045 - time * 7) * amp;
      if (first) { ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    first = true;
    for (let x = hx - R + 6; x > camX - 60; x -= 12) {
      const dist = (hx - x) / 60;
      const amp = Math.min(14, dist * 9);
      const y = pathY(x) + Math.sin(x * 0.045 - time * 7) * amp + 4;
      if (first) { ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.arc(hx, hy, R - 3, -mouthA, mouthA);
    ctx.closePath();
    ctx.fillStyle = '#7a2230';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.arc(hx, hy, R, mouthA, Math.PI * 2 - mouthA);
    ctx.closePath();
    ctx.fillStyle = '#5da271';
    ctx.fill();

    if (mouthA > 0.2) {
      ctx.fillStyle = '#fff';
      for (const s of [1, -1]) {
        const ang = mouthA * 0.55 * s;
        const bx = hx + Math.cos(ang) * (R - 4);
        const by = hy + Math.sin(ang) * (R - 4);
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx - 7, by + s * 2);
        ctx.lineTo(bx - 2, by + s * 7);
        ctx.closePath();
        ctx.fill();
      }
    }

    ctx.beginPath();
    ctx.arc(hx + 2, hy - R + 9, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx + 4.5, hy - R + 9, 2.8, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();

    if (mouthA > 0.3) {
      const flick = Math.sin(time * 16) > 0 ? 1 : 0.6;
      ctx.strokeStyle = '#e2606b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(hx + R - 6, hy);
      ctx.lineTo(hx + R + 13 * flick, hy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(hx + R + 13 * flick, hy);
      ctx.lineTo(hx + R + 18 * flick, hy - 4);
      ctx.moveTo(hx + R + 13 * flick, hy);
      ctx.lineTo(hx + R + 18 * flick, hy + 4);
      ctx.stroke();
    }
  }

  // 덥석! 이펙트
  function drawBurst(x, y, t) {
    const p = t / 0.55;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = '#7dd49a';
    ctx.lineWidth = 3;
    for (let k = 0; k < 8; k++) {
      const a = (Math.PI * 2 * k) / 8;
      const r0 = 12 + p * 26;
      const r1 = r0 + 12;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7dd49a';
    ctx.fillText('덥석!', 0, -36 - p * 14);
    ctx.restore();
  }

  // ── Init ───────────────────────────────────────────────────────
  requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(loop); });
</script>
</body>
</html>
